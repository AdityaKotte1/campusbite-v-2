<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — MunchAdda</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f5;
        color: #111;
        text-align: center;
        padding: 24px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #e8390e;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #555; font-size: 14px; max-width: 320px; margin: 0 0 20px; }
      button {
        background: #e8390e;
        color: #fff;
        border: 0;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="logo">CB</div>
    <h1>You're offline</h1>
    <p>MunchAdda needs an internet connection to load canteens and place orders. Check your connection and try again.</p>
    <button onclick="location.reload()">Retry</button>
  </body>
</html>
